---
# Simple HTTP Honeypot using nginx with custom content
# Serves as Tom's entry point with planted files and hints
apiVersion: v1
kind: ConfigMap
metadata:
  name: honeypot-web-content
  namespace: cyber-riposte
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Production Web Server</title>
      <!-- SSH access available on port 30022 for system administrators -->
    </head>
    <body>
      <h1>Welcome to Production Environment</h1>
      <p>Server: web-prod-01</p>
      <p>Status: Operational</p>

      <h2>Services</h2>
      <ul>
        <li><a href="/admin">Admin Panel</a></li>
        <li><a href="/api">API Documentation</a></li>
        <li><a href="/metrics">System Metrics</a></li>
      </ul>

      <!-- TODO: Remove before production deployment -->
      <!-- Admin credentials stored in /admin/.credentials -->
    </body>
    </html>

  robots.txt: |
    User-agent: *
    Disallow: /admin
    Disallow: /secret
    Disallow: /api/internal
    Disallow: /.git

    # Note: Check dossier archive for incident reports
    # The mirror sees all. Credentials are closer than you think.

    # Development flag (DO NOT USE IN PRODUCTION!)
    # flag{fake_n0t_the_real_fl4g}

  admin.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Admin Panel - Authentication Required</title>
    </head>
    <body>
      <h1>Admin Panel</h1>
      <p>This area is restricted.</p>
      <p>Authorized personnel only.</p>

      <!-- Password: Hi_TOM! -->
      <!-- (Just kidding, that's not the real password) -->

      <h2>System Access</h2>
      <p>For system administration, SSH access is available.</p>
      <p>Default SSH port: 22 (remapped to 30022 externally)</p>
      <p>Hint: Check /home/admin/.notes on the system</p>
    </body>
    </html>

  .credentials: |
    # Admin Credentials - INTERNAL USE ONLY
    # Last updated: 2026-06-04

    # Web Admin Panel
    username: admin
    password: wealth_of_nations  # DECOY - Economics reference

    # SSH Access
    # See /home/admin/.notes for current credentials

    # Dossier Archive - CRITICAL SYSTEM
    # URL: https://dossiers-cyber-riposte.apps.uu7a1hfd.eastus.aroapp.io
    # Username: ctf
    # Password Options (try all until one works):
    #   - Hi_TOM!
    #   - invisible_hand_1776
    #   - creative_destruction
    #   - wealth_of_nations
    #   - i_would_prefer_not_to
    #
    # Note: The scrivener's choice is correct.
    # Hint: Bartleby would understand.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-honeypot
  namespace: cyber-riposte
  labels:
    app: simple-honeypot
    component: http-trap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-honeypot
  template:
    metadata:
      labels:
        app: simple-honeypot
        component: http-trap
    spec:
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:alpine
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: web-content
        configMap:
          name: honeypot-web-content
---
apiVersion: v1
kind: Service
metadata:
  name: simple-honeypot
  namespace: cyber-riposte
  labels:
    app: simple-honeypot
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: simple-honeypot
