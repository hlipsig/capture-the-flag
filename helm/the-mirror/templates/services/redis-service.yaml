{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "the-mirror.namespace" . }}
  labels:
    {{- include "the-mirror.labels" . | nindent 4 }}
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.redis.config.port }}
    targetPort: {{ .Values.redis.config.port }}
    protocol: TCP
    name: redis
  selector:
    app: redis
{{- end }}
