{{- if and .Values.postgres.enabled .Values.postgres.initSchema }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-schema
  namespace: {{ include "the-mirror.namespace" . }}
  labels:
    {{- include "the-mirror.labels" . | nindent 4 }}
data:
  schema.sql: |
{{ .Files.Get "config/schema.sql" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: {{ include "the-mirror.namespace" . }}
  labels:
    {{- include "the-mirror.labels" . | nindent 4 }}
    app: postgres-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        app: postgres-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: postgres-init
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h postgres-0.postgres -p 5432 -U {{ .Values.postgres.credentials.username }}; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done
          echo "PostgreSQL is ready - initializing schema"
          psql -h postgres-0.postgres \
               -U {{ .Values.postgres.credentials.username }} \
               -d {{ .Values.postgres.credentials.database }} \
               -f /schema/schema.sql
          echo "Schema initialization complete"
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: schema
          mountPath: /schema
      volumes:
      - name: schema
        configMap:
          name: postgres-init-schema
{{- end }}
