{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: {{ include "the-mirror.namespace" . }}
  labels:
    {{- include "the-mirror.labels" . | nindent 4 }}
    app: redis
data:
  redis.conf: |
    # Redis configuration for OSINT caching
    bind 0.0.0.0
    port {{ .Values.redis.config.port }}
    protected-mode no
    
    # Memory management
    maxmemory {{ .Values.redis.config.maxMemory }}
    maxmemory-policy {{ .Values.redis.config.maxMemoryPolicy }}
    
    # Persistence (disabled for cache-only use)
    save ""
    appendonly no
    
    # Logging
    loglevel notice
    logfile ""
    
    # Performance
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
{{- end }}
