{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mirror-agent-secrets
  namespace: {{ include "the-mirror.namespace" . }}
  labels:
    {{- include "the-mirror.labels" . | nindent 4 }}
    app: mirror-agent
type: Opaque
stringData:
  DATABASE_URL: {{ include "the-mirror.databaseUrl" . | quote }}
  DOSSIER_PASSWORD: {{ .Values.agent.secrets.dossierPassword | quote }}
  {{- if .Values.agent.secrets.shodanApiKey }}
  SHODAN_API_KEY: {{ .Values.agent.secrets.shodanApiKey | quote }}
  {{- end }}
  {{- if .Values.agent.secrets.githubToken }}
  GITHUB_TOKEN: {{ .Values.agent.secrets.githubToken | quote }}
  {{- end }}
  {{- if .Values.agent.secrets.slackWebhookUrl }}
  SLACK_WEBHOOK_URL: {{ .Values.agent.secrets.slackWebhookUrl | quote }}
  {{- end }}
{{- end }}
