{{- if .Values.productionPortal.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "the-mirror.fullname" . }}-production-secrets
  namespace: {{ include "the-mirror.namespace" . }}
  labels:
    {{- include "the-mirror.labels" . | nindent 4 }}
    app: production-portal
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.productionPortal.secrets.sessionKey | default (randAlphaNum 64) | quote }}
  MASTER_API_KEY: {{ .Values.productionPortal.secrets.masterApiKey | default (printf "flag{production_master_key_%s}" (randAlphaNum 8)) | quote }}
{{- end }}
