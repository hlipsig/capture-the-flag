apiVersion: v1
kind: ServiceAccount
metadata:
  name: mirror-operator
  namespace: cyber-riposte
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mirror-operator
rules:
- apiGroups: ["mirror.ctf"]
  resources: ["incidentdetections"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["mirror.ctf"]
  resources: ["incidentdetections/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["mirror.ctf"]
  resources: ["incidentdetections/finalizers"]
  verbs: ["update"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mirror-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mirror-operator
subjects:
- kind: ServiceAccount
  name: mirror-operator
  namespace: cyber-riposte
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-operator
  namespace: cyber-riposte
  labels:
    app: mirror-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mirror-operator
  template:
    metadata:
      labels:
        app: mirror-operator
    spec:
      serviceAccountName: mirror-operator
      containers:
      - name: manager
        image: image-registry.openshift-image-registry.svc:5000/cyber-riposte/mirror-operator:latest
        command:
        - /manager
        args:
        - --leader-elect=false
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
