apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: mirror-operator
  namespace: cyber-riposte
spec:
  output:
    to:
      kind: ImageStreamTag
      name: mirror-operator:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  triggers: []
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: mirror-operator
  namespace: cyber-riposte
