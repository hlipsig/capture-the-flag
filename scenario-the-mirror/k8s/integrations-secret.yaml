apiVersion: v1
kind: Secret
metadata:
  name: mirror-integrations
  namespace: ctf
type: Opaque
stringData:
  # GitHub Integration
  GITHUB_TOKEN: "ghp_REPLACE_WITH_YOUR_GITHUB_TOKEN"
  GITHUB_REPO: "hlipsig/capture-the-flag"

  # Slack Integration (optional)
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/REPLACE/WITH/YOUR_WEBHOOK"

  # Database
  DATABASE_URL: "postgresql://mirror:password@postgres:5432/mirror"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # OSINT APIs (optional)
  SHODAN_API_KEY: "REPLACE_WITH_YOUR_SHODAN_KEY"

  # CTF: Web Dossier Password (discoverable in honeypot)
  DOSSIER_PASSWORD: "mirror_reflect_6789"
