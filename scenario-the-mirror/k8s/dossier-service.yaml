apiVersion: v1
kind: Service
metadata:
  name: dossier-web
  namespace: ctf
  labels:
    app: mirror-agent
    component: dossier-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: mirror-agent
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dossier-web
  namespace: ctf
spec:
  hosts:
    - "dossiers.ctf.example.com"
  gateways:
    - istio-gateway
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: dossier-web.ctf.svc.cluster.local
            port:
              number: 80
